name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run full unit, mock-HTTP & skill self-containment tests
        run: python3 -W error -m unittest discover -s tests -v

      - name: Verify install.sh dry-run
        run: bash ./install.sh --target all --dry-run
