[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "vibe-observability"
version = "0.3.0"
description = "Framework-agnostic observability auditor, post-deploy live verifier, and read-only signal puller for Vibe Coding & modern full-stack projects."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []
authors = [{ name = "realchendahuang" }]
keywords = [
  "observability",
  "agent-skills",
  "vibe-coding",
  "sentry",
  "posthog",
  "cloudflare-workers",
  "opentelemetry",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/realchendahuang/vibe-observability"
Repository = "https://github.com/realchendahuang/vibe-observability"
Issues = "https://github.com/realchendahuang/vibe-observability/issues"

[project.scripts]
vibe-obs = "vibe_observability.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/vibe_observability"]

[tool.hatch.build.targets.wheel.force-include]
"skills/vibe-observability/scripts/audit_observability.py" = "vibe_observability/_scripts/audit_observability.py"
"skills/vibe-observability/scripts/verify_live.py" = "vibe_observability/_scripts/verify_live.py"
"skills/vibe-observability-loop/scripts/pull_signals.py" = "vibe_observability/_scripts/pull_signals.py"

[tool.hatch.build.targets.sdist]
include = [
  "src/",
  "skills/",
  "README.md",
  "README_ZH.md",
  "LICENSE",
  "pyproject.toml",
]
